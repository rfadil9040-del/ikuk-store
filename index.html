<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ikuk Store</title>
<style>
:root{--bg:#08090d;--card:#11131a;--card2:#171a23;--text:#f5f5f7;--muted:#9299aa;--a:#7c5cff;--a2:#ad91ff;--line:#272b38;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 80% 0,#28175d 0,#08090d 38%);color:var(--text);min-height:100vh}.container{width:min(1050px,92%);margin:auto}
header{padding:19px 0;border-bottom:1px solid #ffffff0d;background:#08090dcc;backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.logo span{color:var(--a2)}.badge{font-size:11px;color:#d5ccff;border:1px solid #453875;padding:7px 10px;border-radius:99px}
.hero{padding:48px 0 28px}.hero h1{font-size:clamp(38px,9vw,65px);line-height:.98;letter-spacing:-2.5px}.hero h1 span{color:var(--a2)}.hero p{color:var(--muted);max-width:620px;margin-top:17px;line-height:1.65}.section{padding:22px 0}.title{font-size:21px;margin-bottom:15px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.game{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;transition:.2s}.game:hover,.game.active{border-color:#644dc0;transform:translateY(-2px);box-shadow:0 12px 30px #0006}.icon{font-size:36px;margin-bottom:10px}.game b{display:block}.game small{color:var(--muted)}
.panel{margin-top:24px;background:#11131af2;border:1px solid var(--line);border-radius:22px;padding:22px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{background:#0c0e14;border:1px solid var(--line);border-radius:15px;padding:17px;cursor:pointer}.product.selected{border-color:var(--a);background:#151127}.product b{display:block;margin-bottom:7px}.price{color:var(--a2);font-weight:850}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b0d12;color:white;outline:none}.notice{margin-top:15px;padding:13px;border-radius:12px;background:#17131f;color:#bfb3e8;font-size:13px;line-height:1.5}
button{width:100%;border:0;border-radius:13px;padding:15px;color:#fff;font-weight:900;cursor:pointer;margin-top:14px}.orderBtn{background:linear-gradient(135deg,var(--a),#9a63ff)}.waBtn{display:none;background:var(--wa);color:#06160b}.preview{display:none;margin-top:15px;padding:15px;border-radius:13px;background:#0c2119;border:1px solid #245d46;color:#b8f5d8;line-height:1.65}
footer{padding:40px 0;color:#656c7c;text-align:center;font-size:13px}@media(max-width:650px){.products{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}@media(max-width:400px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container nav"><div class="logo">IKUK<span>STORE</span></div><div class="badge">ML • ROBLOX</div></div></header>
<main class="container">
<section class="hero"><h1>Top Up Game.<br><span>Gas Tanpa Ribet.</span></h1><p>Order Mobile Legends dan Roblox langsung dari Ikuk Store. Setelah checkout, detail pesanan bisa dikirim ke WhatsApp bisnis lu.</p></section>
<section class="section">
<h2 class="title">Pilih Game</h2>
<div class="games">
<div class="game ml active" onclick="chooseGame('ml',this)"><div class="game-info"><b>Mobile Legends</b><small>Diamonds</small></div></div>
<div class="game roblox" onclick="chooseGame('roblox',this)"><div class="game-info"><b>Roblox</b><small>Robux</small></div></div></div>
<div class="panel">
<h2 class="title" id="gameTitle">Mobile Legends</h2><div class="products" id="products"></div><div class="notice" id="notice"></div>
<div class="form"><input id="userId" placeholder="User ID"><input id="zoneId" placeholder="Zone ID"><select id="payment"><option>QRIS</option><option>DANA</option><option>OVO</option><option>GoPay</option></select></div>
<button class="orderBtn" onclick="makeOrder()">BUAT PESANAN</button>
<div class="preview" id="preview"></div>
<button class="waBtn" id="waBtn" onclick="sendWhatsApp()">KIRIM PESANAN KE WHATSAPP</button>
</div>
</section></main>
<footer>© 2026 Ikuk Store • Prototype</footer>
<script>
/* GANTI NOMOR DI BAWAH DENGAN NOMOR WHATSAPP BISNIS LU.
   Format: kode negara tanpa +, spasi, atau tanda -.
   Contoh Indonesia: 6281234567890 */
const WHATSAPP_NUMBER="6285956441387";

const data={ml:{title:"Mobile Legends",products:[["86 Diamond","Rp20.000"],["172 Diamond","Rp39.000"],["257 Diamond","Rp57.000"],["344 Diamond","Rp75.000"],["429 Diamond","Rp94.000"],["514 Diamond","Rp112.000"]],p1:"User ID",p2:"Zone ID",notice:"Untuk Mobile Legends, masukkan User ID dan Zone ID akun tujuan."},
roblox:{title:"Roblox",products:[["80 Robux","Rp15.000"],["400 Robux","Rp70.000"],["800 Robux","Rp135.000"],["1.700 Robux","Rp275.000"],["4.500 Robux","Rp650.000"],["10.000 Robux","Rp1.350.000"]],p1:"Username / data tujuan",p2:"Catatan (opsional)",notice:"Untuk Roblox, produk ditampilkan sebagai Robux. Metode pengiriman dapat disesuaikan dengan supplier yang lu pakai."}};
let current="ml",product="86 Diamond",price="Rp20.000",message="";

function render(){let d=data[current];gameTitle.textContent=d.title;notice.textContent=d.notice;userId.placeholder=d.p1;zoneId.placeholder=d.p2;products.innerHTML=d.products.map((p,i)=>`<div class="product ${i===0?"selected":""}" onclick="selectProduct(this,'${p[0]}','${p[1]}')"><b>${p[0]}</b><span class="price">${p[1]}</span></div>`).join("");product=d.products[0][0];price=d.products[0][1];}
function chooseGame(g,el){current=g;document.querySelectorAll(".game").forEach(x=>x.classList.remove("active"));el.classList.add("active");render();preview.style.display="none";waBtn.style.display="none";}
function selectProduct(el,n,c){product=n;price=c;document.querySelectorAll(".product").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");}
function makeOrder(){
 let id=userId.value.trim(),z=zoneId.value.trim(),pay=payment.value;
 if(!id){preview.style.display="block";preview.textContent="Masukkan data tujuan dulu, bro.";return}
 let order="IKK-"+Math.floor(100000+Math.random()*900000);
 message=`Halo Ikuk Store! Saya mau order.%0A%0AOrder ID: ${order}%0AGame: ${data[current].title}%0AProduk: ${product}%0AHarga: ${price}%0AData tujuan: ${id}${z?"%0AData tambahan: "+z:""}%0AMetode pembayaran: ${pay}%0A%0AMohon diproses ya.`;
 preview.style.display="block";preview.innerHTML=`<b>Pesanan siap dikirim.</b><br>Order: ${order}<br>${data[current].title} • ${product} • ${price}<br><small>Klik tombol WhatsApp untuk mengirim detail order ke admin.</small>`;
 waBtn.style.display="block";
}
function sendWhatsApp(){
 if(WHATSAPP_NUMBER.includes("X")){alert("Nomor WhatsApp bisnis belum diisi. Edit WHATSAPP_NUMBER di file ini.");return}
 window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+message,"_blank");
}
render();
</script>
</body>
</html>
